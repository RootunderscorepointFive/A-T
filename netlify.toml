[build]
  publish = "."
  command = ""

[context.production]
  # Production context: all deploys from the main branch
  # will inherit these settings.
  branch = "main"

[context.branch-deploy]
  # Branch deploy context: all deploys from any branch
  # will inherit these settings.
  branch = "*"

[context.deploy-preview]
  # Deploy Preview context: all deploys from Pull Request
  # will inherit these settings.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'sha256-s2CuUDOpTncBfDyTAWcVuBjfEQLFBSCFTuxo2DyQEmg='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
